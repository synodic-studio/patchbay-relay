[project]
name = "stargate"
version = "0.2.0"
description = "Claude Code Telegram Bridge — relay Telegram messages to Claude Code sessions"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.1.68",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.1",
    "python-telegram-bot>=22.6",
    "telegramify-markdown>=0.5.4",
]

[dependency-groups]
dev = [
    "hypothesis>=6.152.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["bridge", "stargate"]
omit = ["tests/*", "tcc-approve.py", "validate.py"]

[tool.coverage.report]
show_missing = true
fail_under = 75

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501"]

[tool.ruff.lint.per-file-ignores]
"bridge.py" = ["F401"]
